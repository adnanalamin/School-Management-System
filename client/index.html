<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A secure school management workspace for administrators, teachers, students and parents." />
    <meta name="theme-color" content="#0b5369" />
    <title>School Management System</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('sms-theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      #boot { display: flex; min-height: 100vh; align-items: center; justify-content: center; gap: 12px; font-family: system-ui, sans-serif; color: #5b717a; }
      .boot-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9d6da; border-top-color: #0b5369; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite"><span class="boot-spinner"></span><span>Loading…</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
